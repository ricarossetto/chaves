name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and publish"
        required: true

permissions:
  contents: write
  actions: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
          - name: windows-arm64
            os: windows-11-arm
            target: aarch64-pc-windows-msvc
            bundles: nsis
          - name: linux-x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,appimage
          - name: macos-x64
            os: macos-15-intel
            target: x86_64-apple-darwin
            bundles: dmg
          - name: macos-arm64
            os: macos-15
            target: aarch64-apple-darwin
            bundles: dmg

    env:
      APPIMAGE_EXTRACT_AND_RUN: 1

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            wget \
            file \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            patchelf \
            libfuse2

      - name: Install npm dependencies
        run: npm ci

      - name: Build bundles
        run: npx tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}

      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p release
          find target -type f \( -name '*.exe' -o -name '*.msi' -o -name '*.deb' -o -name '*.AppImage' -o -name '*.dmg' \) -path '*/bundle/*' -exec cp {} release/ \;
          if [ -f "target/${{ matrix.target }}/release/chaves-api.exe" ]; then
            cp "target/${{ matrix.target }}/release/chaves-api.exe" "release/chaves-api-${{ matrix.name }}.exe"
          fi
          if [ -f "target/${{ matrix.target }}/release/chaves-api" ]; then
            cp "target/${{ matrix.target }}/release/chaves-api" "release/chaves-api-${{ matrix.name }}"
          fi
          ls -lh release

      - uses: actions/upload-artifact@v4
        with:
          name: bundles-${{ matrix.name }}
          path: release/*
          if-no-files-found: error

  publish:
    name: publish release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}

      - uses: actions/download-artifact@v4
        with:
          pattern: bundles-*
          merge-multiple: true
          path: release

      - name: Generate checksums
        run: |
          cd release
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: Chaves ${{ github.event.inputs.tag || github.ref_name }}
          body_path: .github/release-notes.md
          files: release/*
          fail_on_unmatched_files: true
          overwrite_files: true
          make_latest: true
