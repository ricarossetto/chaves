[package]
name = "chaves-api"
version = "0.3.0"
edition = "2021"
description = "Local-first vault for API keys, links, and notes"
license = "MIT"
authors = ["Chaves contributors"]
repository = "https://github.com/ricarossetto/chaves"

[lib]
name = "chaves_api_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = []
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
aes-gcm = "0.11"
argon2 = "0.6"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2.7.3"
tauri-plugin-single-instance = "2"

[target.'cfg(windows)'.dependencies]
pollster = "1"
windows = { version = "0.62", features = ["Security_Credentials_UI", "Win32_Foundation", "Win32_Security_Cryptography", "Win32_System_WinRT", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
